name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pandas matplotlib
      - run: make py-test
      - run: make rtl-model-test

  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Compile and simulate RTL (skew-mem unit test + 7 top-level cases)
        run: make rtl-test 2>&1 | tee rtl_test_log.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Verilator lint (informational)
        run: make lint 2>&1 | tee rtl_lint_log.txt
        continue-on-error: true
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl-logs
          path: |
            rtl_test_log.txt
            rtl_lint_log.txt
